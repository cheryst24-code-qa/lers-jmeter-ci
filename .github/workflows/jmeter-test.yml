name: JMeter Load Test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write    # ✅ Нужно для деплоя на GitHub Pages
  pages: write       # ✅ Нужно для GitHub Pages
  id-token: write    # ✅ Для аутентификации


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: apache-jmeter-5.6.3
          key: ${{ runner.os }}-jmeter-5.6.3

      - name: Download JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          rm apache-jmeter-5.6.3.tgz

      - name: Set Environment Variables
        run: |
          echo "JMETER_HOME=${{ github.workspace }}/apache-jmeter-5.6.3" >> $GITHUB_ENV

      - name: Prepare Test Data
        run: |
          mkdir -p jmeter-tests/test-data
          printf '%b\n' "${{ secrets.SECRETS_CSV_CONTENT }}" > jmeter-tests/test-data/secrets.csv

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Run JMeter Test
        working-directory: jmeter-tests
        run: |
          echo "Starting Load Test..."
          $JMETER_HOME/bin/jmeter -n \
            -Djava.awt.headless=true \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jbase_url=${{ secrets.BASE_URL }} \
            -Jbase_port=${{ secrets.BASE_PORT }} \
            -t LERS_Auth_Test_CI.jmx \
            -l result.jtl \
            -e -o report

      - name: Generate Summary
        if: always()
        working-directory: jmeter-tests
        run: |
          echo "## Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f result.jtl ] && [ -s result.jtl ]; then
            TOTAL=$(wc -l < result.jtl)
            ERRORS=$(awk -F',' '$7=="false"{c++}END{print c+0}' result.jtl)
            AVG=$(awk -F',' 'NR>1&&$2~/^[0-9]+$/{s+=$2;c++}END{printf "%.0f",s/c}' result.jtl)
            ERR_PCT=$(awk "BEGIN{printf \"%.2f\",($ERRORS/$TOTAL)*100}")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| Requests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS ($ERR_PCT%) |" >> $GITHUB_STEP_SUMMARY
            echo "| Avg Time | ${AVG} ms |" >> $GITHUB_STEP_SUMMARY
            echo "AVG_TIME=$AVG" >> $GITHUB_ENV
            echo "ERROR_RATE=$ERR_PCT" >> $GITHUB_ENV
            echo "TOTAL_REQ=$TOTAL" >> $GITHUB_ENV
          fi

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="OK"
            TEXT="PASSED"
          else
            EMOJI="FAIL"
            TEXT="FAILED"
          fi
          MSG="${EMOJI} Test ${TEXT} - Repo: ${{ github.repository }} - Requests: ${{ env.TOTAL_REQ }} - Errors: ${{ env.ERROR_RATE }}% - Time: ${{ env.AVG_TIME }} ms"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -d text="$MSG" -d parse_mode="Markdown" || true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report-${{ github.run_id }}
          path: jmeter-tests/report/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jmeter-tests/report
          destination_dir: reports/run-${{ github.run_id }}
          keep_files: true
          enable_jekyll: false