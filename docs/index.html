<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Отчёты ЛЭРС — Нагрузочное тестирование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #aaa; font-size: 1.1em; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-value.success { color: #00ff88; }
        .stat-value.warning { color: #ffaa00; }
        .stat-value.error { color: #ff4757; }
        .stat-label { color: #aaa; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        
        .reports {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .reports h2 {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,217,255,0.3);
        }
        .report-list { list-style: none; }
        .report-item {
            padding: 15px 20px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .report-item:hover {
            background: rgba(0,217,255,0.1);
            transform: translateX(5px);
        }
        .report-link {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 500;
        }
        .report-link:hover { text-decoration: underline; }
        .report-meta { color: #888; font-size: 0.9em; }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .badge-success { background: rgba(0,255,136,0.2); color: #00ff88; }
        .empty { text-align: center; padding: 40px; color: #888; }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Отчёты нагрузочного тестирования</h1>
            <p>ЛЭРС УЧЁТ • Автоматические тесты производительности</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Среднее время</div>
                <div class="stat-value success">103<span style="font-size:0.5em">мс</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ошибки</div>
                <div class="stat-value success">0.00<span style="font-size:0.5em">%</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Запусков</div>
                <div class="stat-value" id="runCount">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Последний</div>
                <div class="stat-value" id="lastRun" style="font-size:1.5em">—</div>
            </div>
        </div>

        <div class="reports">
            <h2>📁 История запусков</h2>
            <div id="reportList" class="report-list">
                <div class="empty">⏳ Загрузка отчётов...</div>
            </div>
        </div>

        <div class="footer">
            <p>Обновлено: <span id="updateTime"></span></p>
        </div>
    </div>

    <script>
        // Установка времени обновления
        document.getElementById('updateTime').textContent = new Date().toLocaleString('ru-RU');
        
        // Загрузка списка отчётов
        fetch('reports/')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a[href$="/"]');
                const reports = [];
                
                links.forEach(link => {
                    const name = link.textContent.trim();
                    if (name && name.startsWith('run-')) {
                        reports.push({
                            id: name.replace('run-', ''),
                            url: `reports/${name}/index.html`
                        });
                    }
                });
                
                // Сортировка: новые сверху
                reports.sort((a, b) => b.id - a.id);
                
                // Обновление статистики
                document.getElementById('runCount').textContent = reports.length;
                if (reports.length > 0) {
                    document.getElementById('lastRun').textContent = '#' + reports[0].id;
                }
                
                // Отображение списка
                const list = document.getElementById('reportList');
                if (reports.length > 0) {
                    list.innerHTML = reports.map(r => `
                        <div class="report-item">
                            <div>
                                <a class="report-link" href="${r.url}" target="_blank">
                                    📄 Запуск #${r.id}
                                </a>
                                <div class="report-meta">Отчёт о тестировании</div>
                            </div>
                            <span class="badge badge-success">✅ Успешно</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty">🚀 Отчётов пока нет. Запустите первый тест!</div>';
                }
            })
            .catch(() => {
                document.getElementById('reportList').innerHTML = 
                    '<div class="empty">⚠️ Не удалось загрузить список</div>';
            });
    </script>
</body>
</html>
