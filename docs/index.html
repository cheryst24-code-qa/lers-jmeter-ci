<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Отчёты нагрузочного тестирования ЛЭРС</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .reports {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .reports h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .report-list {
            list-style: none;
        }
        .report-item {
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .report-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        .report-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
        }
        .report-link:hover {
            text-decoration: underline;
        }
        .report-date {
            color: #999;
            font-size: 0.9em;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Отчёты нагрузочного тестирования</h1>
            <p>ЛЭРС УЧЁТ — Автоматизированные тесты производительности</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Среднее время</div>
                <div class="stat-value">103<span style="font-size:0.5em">мс</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ошибки</div>
                <div class="stat-value" style="color:#28a745">0<span style="font-size:0.5em">%</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Всего запусков</div>
                <div class="stat-value" id="totalRuns">0</div>
            </div>
        </div>

        <div class="reports">
            <h2>📁 История запусков</h2>
            <div id="reportList" class="report-list">
                <div class="empty-state">
                    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
                    <p>Загрузка отчётов...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Автоматический поиск отчётов
        fetch('reports/')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a[href$="/"]');
                const list = document.getElementById('reportList');
                const reports = [];
                
                links.forEach(link => {
                    const name = link.textContent.trim();
                    if (name && name.startsWith('run-')) {
                        const runId = name.replace('run-', '');
                        reports.push({ id: runId, name: name, url: `reports/${name}/index.html` });
                    }
                });
                
                // Сортировка по убыванию (новые сверху)
                reports.sort((a, b) => b.id - a.id);
                
                // Обновление счётчика
                document.getElementById('totalRuns').textContent = reports.length;
                
                // Отображение списка
                if (reports.length > 0) {
                    list.innerHTML = reports.map(report => `
                        <div class="report-item">
                            <div>
                                <a class="report-link" href="${report.url}" target="_blank">
                                    📄 Запуск #${report.id}
                                </a>
                                <div class="report-date">ID: ${report.id}</div>
                            </div>
                            <span class="status-badge status-success">✅ Успешно</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `
                        <div class="empty-state">
                            <p>Отчётов пока нет. Запустите тест!</p>
                        </div>
                    `;
                }
            })
            .catch(() => {
                document.getElementById('reportList').innerHTML = `
                    <div class="empty-state">
                        <p>⚠️ Не удалось загрузить список отчётов</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
